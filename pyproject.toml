[project]
name = "vooi-arb"
version = "0.1.0"
description = "Analysis and monitoring toolkit for funding arbitrage on VOOI perps"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Dado-hash"}]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.urls]
Repository = "https://github.com/Dado-hash/vooi-funding-arbitrage"

[project.scripts]
arb = "arb.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arb"]
