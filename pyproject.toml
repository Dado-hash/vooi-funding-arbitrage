[project]
name = "vooi-arb"
version = "0.1.0"
description = "Toolkit di analisi e monitoraggio per funding arbitrage su VOOI"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
arb = "arb.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arb"]
