# Default parameters. CLI flags take precedence.

[scan]
venues = ["hyperliquid", "lighter"] # [] = all venues. Chosen with `arb venues` on 2026-10-15
both_legs = true                    # both legs must be in `venues` (as in the VOOI UI)
notional_usd = 1000                 # notional per leg: $500 margin per venue × 2x leverage
horizon_h = 168                     # holding horizon (7 days): with taker fees, 72h is not enough to cover costs
min_hist_apr = 0.05                 # minimum 7d mean APR to make the ranking (0.05 = 5%)
min_volume_usd = 100000             # minimum 24h volume of the strategy (sum of legs)
min_oi_usd = 50000                  # minimum open interest per leg
deep = 15                           # pairs for which slippage and real costs are computed
history_days = 30                   # history for persistence metrics (pos_all, mean_all); the 24h/72h/7d windows stay

# On-chain venues (registration with wallet signature, no API key). `arb scan --dex`.
[venues]
dex = ["hyperliquid", "lighter", "aster", "extended", "ondo", "robinhood"]

# Taker fee per venue, as a fraction (0.00045 = 4.5 bps). Values from `get_quotes` (feesBps) on 2026-10-15,
# VOOI fees included. Only used as an estimate in stage 2: stage 3 reads the real fees of the single
# market from `get_quotes` (HIP-3 markets may have different fees).
[fees.taker]
hyperliquid = 0.00045
lighter = 0.00025
aster = 0.0006
extended = 0.00045
ondo = 0.00045
robinhood = 0.00055
binance = 0.0005
bybit = 0.00055
mexc = 0.0002
gate = 0.0005

# Limits for `arb execute`, checked on every approved proposal regardless of its contents.
[execution]
venues = ["hyperliquid", "lighter"]
max_notional_per_leg = 1000        # USD
max_leverage = 2
max_price_drift = 0.01             # maximum price move from the proposal's reference price
max_basis_worsening = 0.002        # maximum basis worsening (20 bps) before re-proposing
proposal_ttl_min = 15              # proposal validity: after that, the approval no longer counts
tp_sl = true                       # TP/SL on the opening orders (and in the notify instructions)
tp_sl_liq_fraction = 0.7           # levels at 70% of the estimated (isolated) liquidation distance

# Rules for the monitoring cycle (see docs/cycle.md)
# Example values for about $120 total capital: one strategy, $100 per leg.
[strategy]
max_strategies = 1                 # strategies in parallel (one at this capital size)
notional_per_strategy = 100        # USD per leg: with ~$58 per venue at 2x (margin $50 + 10% buffer)
leverage = 2                       # leverage used on both legs
min_apr_on_capital = 0.20          # minimum net annualized return on committed capital (margin), leverage included
max_breakeven_h = 72               # maximum hours to cover costs
capital_buffer = 0.10              # extra margin required per venue beyond notional/leverage (fees, swings)

[monitor]
min_liq_distance = 0.15     # below this distance from the liquidation price: margin alarm
max_imbalance = 0.05        # tolerated long/short notional imbalance
exit_lookahead_h = 24       # window over which to check whether the expected spread stays positive
rotate_min_uplift = 0.5     # rotate only if the expected net gain improves by at least +50%
